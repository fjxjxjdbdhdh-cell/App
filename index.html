<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GM Trading AI — #1 Trading Platform 2026</title>
<meta name="description" content="Самый мощный торговый ИИ в истории. Автоторговля, анализ рынка, нейросеть с IQ 500+">
<style>
/* ============================================================
   VARIABLES & RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #6C63FF;
  --primary-light: #8B7FFF;
  --primary-dark: #4A43CC;
  --secondary: #00D4FF;
  --secondary-dark: #0099CC;
  --accent: #B44FFF;
  --accent2: #FF6584;
  --success: #00FFB3;
  --success-dark: #00CC8F;
  --danger: #FF4757;
  --warning: #FFB830;
  --gold: #FFD700;
  --bg-base: #05050F;
  --bg-dark: #080814;
  --bg-card: #0D0D1A;
  --bg-card2: #10101F;
  --bg-input: #141428;
  --bg-hover: #1A1A30;
  --border: rgba(108,99,255,0.15);
  --border-bright: rgba(108,99,255,0.4);
  --text: #F0F0FF;
  --text-2: #A0A0C0;
  --text-3: #606080;
  --glow-p: 0 0 30px rgba(108,99,255,0.5);
  --glow-s: 0 0 30px rgba(0,212,255,0.4);
  --glow-a: 0 0 30px rgba(180,79,255,0.4);
  --r: 12px; --r-sm: 8px; --r-lg: 16px; --r-xl: 24px;
  --tr: all 0.3s cubic-bezier(0.4,0,0.2,1);
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'Consolas', 'Courier New', monospace;
  --sidebar-w: 260px;
}
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg-base);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

/* ============================================================
   ANIMATIONS
   ============================================================ */
@keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideLeft { from{opacity:0;transform:translateX(-30px)} to{opacity:1;transform:translateX(0)} }
@keyframes slideRight { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.7;transform:scale(.97)} }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
@keyframes glow {
  0%,100%{box-shadow:0 0 10px rgba(108,99,255,.3)}
  50%{box-shadow:0 0 40px rgba(108,99,255,.8),0 0 80px rgba(108,99,255,.3)}
}
@keyframes glowText {
  0%,100%{text-shadow:0 0 10px var(--primary)}
  50%{text-shadow:0 0 20px var(--primary),0 0 40px var(--primary),0 0 60px rgba(108,99,255,.5)}
}
@keyframes shimmer {
  0%{background-position:-1000px 0}
  100%{background-position:1000px 0}
}
@keyframes gradMove {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
@keyframes toastIn { from{opacity:0;transform:translateX(120%)} to{opacity:1;transform:translateX(0)} }
@keyframes toastOut { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(120%)} }
@keyframes orb { 0%{transform:translate(0,0) scale(1)} 33%{transform:translate(60px,-40px) scale(1.1)} 66%{transform:translate(-40px,60px) scale(.9)} 100%{transform:translate(0,0) scale(1)} }
@keyframes borderGlow {
  0%,100%{border-color:rgba(108,99,255,.2)}
  50%{border-color:rgba(108,99,255,.6)}
}
@keyframes scanline {
  0%{top:-10%} 100%{top:110%}
}
@keyframes countUp { from{opacity:0;transform:scale(.5)} to{opacity:1;transform:scale(1)} }
@keyframes waveform {
  0%,100%{height:4px} 50%{height:20px}
}
@keyframes typewriter {
  from{width:0} to{width:100%}
}
@keyframes rainDrop {
  0%{opacity:1;transform:translateY(-100%)}
  100%{opacity:0;transform:translateY(100vh)}
}

/* ============================================================
   LANDING PAGE
   ============================================================ */
#landingPage {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
.landing-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: .15;
}
.orb-1 {
  width: 600px; height: 600px;
  background: var(--primary);
  top: -200px; left: -200px;
  animation: orb 20s ease-in-out infinite;
}
.orb-2 {
  width: 500px; height: 500px;
  background: var(--accent);
  bottom: -100px; right: -100px;
  animation: orb 25s ease-in-out infinite reverse;
}
.orb-3 {
  width: 400px; height: 400px;
  background: var(--secondary);
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  animation: orb 18s ease-in-out infinite 5s;
}
.grid-bg {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(108,99,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(108,99,255,.03) 1px, transparent 1px);
  background-size: 50px 50px;
}
.scanline {
  position: absolute;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(108,99,255,.3), transparent);
  animation: scanline 8s linear infinite;
}

/* LANDING NAV */
.landing-nav {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 60px;
  background: rgba(5,5,15,.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.landing-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
}
.landing-logo .logo-icon {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: var(--glow-p);
}
.landing-logo .logo-name {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.5px;
}
.logo-gm { color: var(--primary); }
.logo-ai { color: var(--secondary); }
.logo-trading { color: var(--text-2); font-size: 13px; font-weight: 400; display: block; margin-top: -4px; }
.landing-nav-links { display: flex; align-items: center; gap: 8px; }
.nav-link-item {
  padding: 8px 16px;
  color: var(--text-2);
  text-decoration: none;
  border-radius: var(--r-sm);
  font-size: 14px;
  font-weight: 500;
  transition: var(--tr);
  cursor: pointer;
  border: none;
  background: none;
  font-family: var(--font);
}
.nav-link-item:hover { color: var(--text); background: var(--bg-hover); }
.btn-nav-login {
  padding: 9px 22px;
  background: transparent;
  border: 1px solid var(--border-bright);
  color: var(--primary);
  border-radius: var(--r-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--tr);
  font-family: var(--font);
}
.btn-nav-login:hover {
  background: rgba(108,99,255,.1);
  box-shadow: var(--glow-p);
}
.btn-nav-start {
  padding: 9px 22px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border: none;
  color: #fff;
  border-radius: var(--r-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--tr);
  font-family: var(--font);
  box-shadow: var(--glow-p);
}
.btn-nav-start:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(108,99,255,.6); }

/* HERO SECTION */
.hero {
  position: relative;
  z-index: 1;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 80px 40px 60px;
  min-height: 90vh;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(108,99,255,.1);
  border: 1px solid rgba(108,99,255,.3);
  border-radius: 50px;
  padding: 8px 20px;
  font-size: 13px;
  color: var(--primary-light);
  font-weight: 600;
  margin-bottom: 32px;
  animation: fadeUp .8s ease;
  letter-spacing: .5px;
}
.hero-badge-dot {
  width: 8px; height: 8px;
  background: var(--success);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
  box-shadow: 0 0 8px var(--success);
}
.hero-title {
  font-size: clamp(38px, 6vw, 80px);
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: 24px;
  animation: fadeUp .8s ease .1s both;
  letter-spacing: -2px;
}
.hero-title .line1 { display: block; color: var(--text); }
.hero-title .line2 {
  display: block;
  background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradMove 4s ease infinite, fadeUp .8s ease .2s both;
}
.hero-title .line3 { display: block; color: var(--text-2); font-weight: 300; font-size: .6em; letter-spacing: 0; }
.hero-sub {
  font-size: clamp(15px, 2vw, 19px);
  color: var(--text-2);
  max-width: 680px;
  margin: 0 auto 44px;
  animation: fadeUp .8s ease .3s both;
  line-height: 1.7;
}
.hero-cta {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
  animation: fadeUp .8s ease .4s both;
  margin-bottom: 64px;
}
.btn-hero-primary {
  padding: 18px 44px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border: none;
  color: #fff;
  border-radius: var(--r);
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--tr);
  font-family: var(--font);
  box-shadow: 0 0 40px rgba(108,99,255,.5), 0 10px 30px rgba(0,0,0,.3);
  letter-spacing: .3px;
}
.btn-hero-primary:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 0 60px rgba(108,99,255,.8), 0 20px 40px rgba(0,0,0,.4);
}
.btn-hero-secondary {
  padding: 18px 44px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border-bright);
  color: var(--text);
  border-radius: var(--r);
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--tr);
  font-family: var(--font);
  backdrop-filter: blur(10px);
}
.btn-hero-secondary:hover {
  background: rgba(108,99,255,.1);
  border-color: var(--primary);
  transform: translateY(-2px);
}

/* STATS ROW */
.hero-stats {
  display: flex;
  gap: 60px;
  justify-content: center;
  flex-wrap: wrap;
  animation: fadeUp .8s ease .5s both;
}
.hero-stat { text-align: center; }
.hero-stat-value {
  font-size: 36px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  margin-bottom: 4px;
}
.hero-stat-label { font-size: 12px; color: var(--text-3); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }

/* FEATURES SECTION */
.section {
  position: relative;
  z-index: 1;
  padding: 80px 60px;
}
.section-header { text-align: center; margin-bottom: 60px; }
.section-tag {
  display: inline-block;
  background: rgba(108,99,255,.1);
  border: 1px solid rgba(108,99,255,.2);
  color: var(--primary-light);
  padding: 6px 16px;
  border-radius: 50px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 16px;
}
.section-title {
  font-size: clamp(28px, 4vw, 48px);
  font-weight: 900;
  margin-bottom: 16px;
  letter-spacing: -1px;
}
.section-title span {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.section-desc { font-size: 17px; color: var(--text-2); max-width: 600px; margin: 0 auto; }

/* FEATURE CARDS */
.features-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 24px;
}
.feature-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 32px;
  transition: var(--tr);
  position: relative;
  overflow: hidden;
  animation: fadeUp .8s ease both;
}
.feature-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
  opacity: 0;
  transition: var(--tr);
}
.feature-card:hover {
  border-color: var(--border-bright);
  transform: translateY(-6px);
  box-shadow: 0 20px 60px rgba(0,0,0,.4), 0 0 30px rgba(108,99,255,.15);
}
.feature-card:hover::before { opacity: 1; }
.feature-icon {
  width: 60px; height: 60px;
  border-radius: var(--r);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin-bottom: 20px;
  position: relative;
}
.fi-purple { background: rgba(108,99,255,.15); }
.fi-blue { background: rgba(0,212,255,.15); }
.fi-green { background: rgba(0,255,179,.15); }
.fi-pink { background: rgba(255,101,132,.15); }
.fi-gold { background: rgba(255,215,0,.15); }
.fi-violet { background: rgba(180,79,255,.15); }
.feature-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
.feature-desc { font-size: 14px; color: var(--text-2); line-height: 1.7; }
.feature-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.ftag {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  background: rgba(108,99,255,.1);
  color: var(--primary-light);
  border: 1px solid rgba(108,99,255,.15);
}

/* PREVIEW SECTION */
.preview-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  overflow: hidden;
  margin: 0 60px 80px;
  position: relative;
  z-index: 1;
}
.preview-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 16px 24px;
  background: var(--bg-card2);
  border-bottom: 1px solid var(--border);
}
.preview-dot { width: 12px; height: 12px; border-radius: 50%; }
.pd-red { background: #FF5F57; }
.pd-yellow { background: #FEBC2E; }
.pd-green { background: #28C840; }
.preview-title { margin-left: 12px; font-size: 13px; color: var(--text-2); font-family: var(--mono); }
.preview-body { padding: 40px; }
.preview-dashboard {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.prev-card {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 20px;
  text-align: center;
  transition: var(--tr);
}
.prev-card:hover { border-color: var(--primary); transform: translateY(-3px); }
.prev-card-icon { font-size: 24px; margin-bottom: 8px; }
.prev-card-value { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.prev-card-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .8px; }
.prev-green { color: var(--success); }
.prev-blue { color: var(--secondary); }
.prev-purple { color: var(--primary); }
.prev-gold { color: var(--gold); }
.preview-charts {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
}
.prev-chart {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 20px;
  height: 180px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
.prev-chart-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 16px; }
.chart-bars {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 120px;
  flex: 1;
}
.chart-bar {
  flex: 1;
  border-radius: 3px 3px 0 0;
  transition: var(--tr);
  min-height: 4px;
}
.chart-bar:hover { opacity: .8; filter: brightness(1.2); }
.bar-up { background: linear-gradient(to top, var(--success-dark), var(--success)); }
.bar-down { background: linear-gradient(to top, #cc3344, var(--danger)); }
.prev-signals { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.prev-signal {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: var(--bg-card2);
  border-radius: var(--r-sm);
  border-left: 3px solid transparent;
  font-size: 13px;
}
.sig-buy { border-left-color: var(--success); }
.sig-sell { border-left-color: var(--danger); }
.sig-wait { border-left-color: var(--warning); }
.sig-label { font-weight: 700; font-size: 11px; padding: 2px 8px; border-radius: 4px; }
.sig-label-buy { background: rgba(0,255,179,.15); color: var(--success); }
.sig-label-sell { background: rgba(255,71,87,.15); color: var(--danger); }
.sig-label-wait { background: rgba(255,184,48,.15); color: var(--warning); }
.sig-conf { font-size: 12px; color: var(--text-3); }

/* ============================================================
   PRICING SECTION
   ============================================================ */
.pricing-section {
  position: relative;
  z-index: 1;
  padding: 80px 60px;
  background: linear-gradient(180deg, transparent, rgba(108,99,255,.03), transparent);
}
.pricing-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  max-width: 1000px;
  margin: 0 auto;
}
.pricing-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 36px 32px;
  position: relative;
  transition: var(--tr);
  overflow: hidden;
}
.pricing-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--r-xl);
  opacity: 0;
  transition: var(--tr);
  background: linear-gradient(135deg, rgba(108,99,255,.05), rgba(0,212,255,.03));
}
.pricing-card:hover {
  transform: translateY(-8px);
  border-color: var(--border-bright);
  box-shadow: 0 30px 80px rgba(0,0,0,.5);
}
.pricing-card:hover::after { opacity: 1; }
.pricing-card.featured {
  border-color: var(--primary);
  box-shadow: var(--glow-p), 0 20px 60px rgba(0,0,0,.4);
  background: linear-gradient(180deg, rgba(108,99,255,.08), var(--bg-card));
}
.pricing-card.featured-gold {
  border-color: var(--gold);
  box-shadow: 0 0 30px rgba(255,215,0,.3), 0 20px 60px rgba(0,0,0,.4);
  background: linear-gradient(180deg, rgba(255,215,0,.06), var(--bg-card));
}
.pricing-badge {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  padding: 5px 20px;
  border-radius: 50px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  white-space: nowrap;
}
.badge-popular {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #fff;
  box-shadow: var(--glow-p);
}
.badge-business {
  background: linear-gradient(135deg, var(--gold), #FFA500);
  color: #000;
  box-shadow: 0 0 15px rgba(255,215,0,.4);
}
.pricing-plan { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--text-2); margin-bottom: 8px; }
.pricing-price { font-size: 52px; font-weight: 900; line-height: 1; margin-bottom: 4px; letter-spacing: -2px; }
.pricing-period { font-size: 14px; color: var(--text-3); margin-bottom: 24px; }
.pricing-desc { font-size: 14px; color: var(--text-2); margin-bottom: 28px; line-height: 1.6; }
.pricing-features { list-style: none; margin-bottom: 32px; }
.pricing-features li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 14px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,.03);
  color: var(--text-2);
}
.pricing-features li:last-child { border-bottom: none; }
.pf-check { color: var(--success); font-size: 16px; margin-top: 2px; flex-shrink: 0; }
.pf-cross { color: var(--text-3); font-size: 16px; margin-top: 2px; flex-shrink: 0; }
.pf-text strong { color: var(--text); }
.pricing-iq {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: rgba(108,99,255,.1);
  border: 1px solid rgba(108,99,255,.2);
  border-radius: 50px;
  font-size: 13px;
  font-weight: 700;
  color: var(--primary-light);
  margin-bottom: 20px;
}
.iq-pulse { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; animation: pulse 1.5s ease infinite; box-shadow: 0 0 8px var(--primary); }
.btn-pricing {
  width: 100%;
  padding: 14px;
  border-radius: var(--r);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--tr);
  border: none;
  font-family: var(--font);
}
.btn-free { background: var(--bg-input); color: var(--text-2); border: 1px solid var(--border); }
.btn-free:hover { border-color: var(--primary); color: var(--primary); }
.btn-vip { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; box-shadow: var(--glow-p); }
.btn-vip:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(108,99,255,.6); }
.btn-business { background: linear-gradient(135deg, var(--gold), #FFA500); color: #000; font-weight: 800; }
.btn-business:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,215,0,.4); }

/* PAYMENT INFO */
.payment-info {
  max-width: 600px;
  margin: 40px auto 0;
  text-align: center;
}
.payment-title { font-size: 16px; font-weight: 700; color: var(--text-2); margin-bottom: 20px; }
.payment-methods {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}
.payment-method {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 24px;
  transition: var(--tr);
}
.payment-method:hover { border-color: var(--primary); }
.pm-icon { font-size: 24px; }
.pm-details { text-align: left; }
.pm-name { font-size: 13px; font-weight: 700; }
.pm-value { font-size: 12px; color: var(--text-3); font-family: var(--mono); }

/* TESTIMONIALS */
.testimonials { padding: 80px 60px; position: relative; z-index: 1; }
.testimonials-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.testimonial-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 28px;
  transition: var(--tr);
}
.testimonial-card:hover { border-color: var(--border-bright); transform: translateY(-4px); }
.testimonial-stars { color: var(--gold); font-size: 14px; margin-bottom: 12px; letter-spacing: 2px; }
.testimonial-text { font-size: 14px; color: var(--text-2); line-height: 1.7; margin-bottom: 20px; font-style: italic; }
.testimonial-author { display: flex; align-items: center; gap: 12px; }
.author-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
  color: #fff;
}
.av-1 { background: linear-gradient(135deg, var(--primary), var(--accent)); }
.av-2 { background: linear-gradient(135deg, var(--secondary), #0066FF); }
.av-3 { background: linear-gradient(135deg, var(--success), #00CC66); }
.author-name { font-size: 14px; font-weight: 700; }
.author-sub { font-size: 12px; color: var(--text-3); }

/* FOOTER */
.landing-footer {
  position: relative;
  z-index: 1;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  padding: 48px 60px 32px;
}
.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 40px; margin-bottom: 40px; }
.footer-brand .footer-logo {
  font-size: 24px;
  font-weight: 900;
  margin-bottom: 12px;
}
.footer-desc { font-size: 13px; color: var(--text-3); line-height: 1.7; margin-bottom: 20px; }
.footer-social { display: flex; gap: 10px; }
.social-btn {
  width: 36px; height: 36px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: var(--tr);
  cursor: pointer;
  text-decoration: none;
}
.social-btn:hover { border-color: var(--primary); background: rgba(108,99,255,.1); }
.footer-col-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-2); margin-bottom: 16px; }
.footer-links { list-style: none; }
.footer-links li { margin-bottom: 10px; }
.footer-links a { font-size: 13px; color: var(--text-3); text-decoration: none; transition: var(--tr); cursor: pointer; }
.footer-links a:hover { color: var(--primary); }
.footer-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-3);
}

/* ============================================================
   AUTH SCREEN
   ============================================================ */
#authScreen {
  position: fixed;
  inset: 0;
  background: rgba(5,5,15,.95);
  backdrop-filter: blur(20px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
#authScreen.show { display: flex; }
.auth-container {
  width: 460px;
  max-width: 95vw;
  animation: fadeUp .5s ease;
}
.auth-box {
  background: var(--bg-card);
  border: 1px solid var(--border-bright);
  border-radius: var(--r-xl);
  padding: 48px 40px;
  box-shadow: var(--glow-p), 0 40px 100px rgba(0,0,0,.7);
  position: relative;
  overflow: hidden;
}
.auth-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent), var(--primary));
  background-size: 200% 100%;
  animation: shimmer 3s linear infinite;
}
.auth-close-btn {
  position: absolute;
  top: 16px; right: 16px;
  width: 32px; height: 32px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 16px;
  color: var(--text-2);
  transition: var(--tr);
}
.auth-close-btn:hover { background: rgba(255,71,87,.1); border-color: var(--danger); color: var(--danger); }
.auth-logo { text-align: center; margin-bottom: 32px; }
.auth-logo-icon {
  font-size: 52px;
  display: block;
  margin-bottom: 12px;
  animation: float 3s ease-in-out infinite;
}
.auth-logo h1 {
  font-size: 26px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
}
.auth-logo p { font-size: 13px; color: var(--text-3); }
.auth-tabs {
  display: flex;
  background: var(--bg-input);
  border-radius: var(--r-sm);
  padding: 4px;
  gap: 4px;
  margin-bottom: 28px;
}
.auth-tab {
  flex: 1;
  padding: 10px;
  border: none;
  background: transparent;
  color: var(--text-2);
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: var(--tr);
  font-family: var(--font);
}
.auth-tab.active {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #fff;
  box-shadow: var(--glow-p);
}
.form-group { margin-bottom: 18px; }
.form-label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 7px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.form-control {
  width: 100%;
  padding: 13px 16px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--text);
  font-size: 14px;
  transition: var(--tr);
  outline: none;
  font-family: var(--font);
}
.form-control:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(108,99,255,.15);
}
.form-control::placeholder { color: var(--text-3); }
.auth-error {
  background: rgba(255,71,87,.08);
  border: 1px solid rgba(255,71,87,.25);
  color: var(--danger);
  padding: 10px 14px;
  border-radius: var(--r-sm);
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
  animation: fadeIn .3s ease;
}
.btn-auth {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: var(--r-sm);
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--tr);
  font-family: var(--font);
  box-shadow: var(--glow-p);
  letter-spacing: .3px;
}
.btn-auth:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(108,99,255,.6); }

/* ============================================================
   MAIN APP
   ============================================================ */
#mainApp { display: none; min-height: 100vh; }
.app-layout { display: flex; min-height: 100vh; }

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  left: 0; top: 0; bottom: 0;
  z-index: 100;
  overflow-y: auto;
  transition: var(--tr);
}
.sidebar-header {
  padding: 20px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.sidebar-logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  box-shadow: var(--glow-p);
  animation: glow 4s ease-in-out infinite;
}
.sidebar-logo-text .logo-main { font-size: 17px; font-weight: 900; }
.sidebar-logo-text .logo-sub { font-size: 10px; color: var(--text-3); }
.sidebar-nav { flex: 1; padding: 16px 10px; }
.nav-section { margin-bottom: 24px; }
.nav-section-title {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 4px 10px 8px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: var(--tr);
  color: var(--text-2);
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 2px;
  position: relative;
  user-select: none;
  border: 1px solid transparent;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active {
  background: rgba(108,99,255,.12);
  color: var(--primary-light);
  border-color: rgba(108,99,255,.2);
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 20%; bottom: 20%;
  width: 3px;
  background: linear-gradient(to bottom, var(--primary), var(--accent));
  border-radius: 0 3px 3px 0;
}
.nav-icon { font-size: 17px; min-width: 20px; text-align: center; }
.nav-label { flex: 1; }
.nav-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 10px;
  background: var(--primary);
  color: #fff;
  animation: pulse 2s ease infinite;
}
.nav-badge-green { background: var(--success-dark); }
.nav-badge-red { background: var(--danger); }
.sidebar-footer {
  padding: 16px;
  border-top: 1px solid var(--border);
}
.user-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  background: var(--bg-input);
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
}
.user-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}
.user-name { font-size: 13px; font-weight: 600; }
.user-tier {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.tier-free { color: var(--text-3); }
.tier-vip { color: var(--primary-light); }
.tier-admin { color: var(--gold); }
.sidebar-logout {
  margin-left: auto;
  width: 28px; height: 28px;
  background: transparent;
  border: none;
  color: var(--text-3);
  cursor: pointer;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: var(--tr);
}
.sidebar-logout:hover { color: var(--danger); background: rgba(255,71,87,.1); }

/* TOPBAR */
.topbar {
  position: fixed;
  top: 0;
  left: var(--sidebar-w);
  right: 0;
  height: 64px;
  background: rgba(8,8,20,.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  z-index: 99;
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.page-title { font-size: 20px; font-weight: 800; }
.page-subtitle { font-size: 13px; color: var(--text-3); margin-top: 1px; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.topbar-clock {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--secondary);
  font-weight: 600;
  padding: 6px 14px;
  background: rgba(0,212,255,.05);
  border: 1px solid rgba(0,212,255,.15);
  border-radius: var(--r-sm);
}
.ws-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: var(--r-sm);
  border: 1px solid;
}
.ws-connected { color: var(--success); border-color: rgba(0,255,179,.2); background: rgba(0,255,179,.05); }
.ws-disconnected { color: var(--danger); border-color: rgba(255,71,87,.2); background: rgba(255,71,87,.05); }
.ws-dot { width: 7px; height: 7px; border-radius: 50%; animation: pulse 1.5s ease infinite; }
.ws-connected .ws-dot { background: var(--success); box-shadow: 0 0 6px var(--success); }
.ws-disconnected .ws-dot { background: var(--danger); }
.topbar-btn {
  width: 36px; height: 36px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 16px;
  transition: var(--tr);
  color: var(--text-2);
  position: relative;
}
.topbar-btn:hover { border-color: var(--primary); color: var(--primary); }
.notif-count {
  position: absolute;
  top: -4px; right: -4px;
  width: 16px; height: 16px;
  background: var(--danger);
  border-radius: 50%;
  font-size: 9px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* MAIN CONTENT */
.main-content {
  margin-left: var(--sidebar-w);
  padding-top: 64px;
  min-height: 100vh;
  flex: 1;
}
.page { display: none; padding: 28px; animation: fadeUp .5s ease; }
.page.active { display: block; }

/* ============================================================
   CARDS & COMPONENTS
   ============================================================ */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 24px;
  transition: var(--tr);
}
.card:hover { border-color: rgba(108,99,255,.2); }
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.card-title {
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title-icon { font-size: 18px; }

/* METRIC CARDS */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.metric-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 20px 22px;
  position: relative;
  overflow: hidden;
  transition: var(--tr);
  animation: fadeUp .5s ease both;
}
.metric-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  opacity: 0.6;
}
.mc-purple::before { background: linear-gradient(90deg, var(--primary), var(--accent)); }
.mc-blue::before { background: linear-gradient(90deg, var(--secondary), #0066FF); }
.mc-green::before { background: linear-gradient(90deg, var(--success), #00CC66); }
.mc-red::before { background: linear-gradient(90deg, var(--danger), #FF6B81); }
.mc-gold::before { background: linear-gradient(90deg, var(--gold), #FFA500); }
.mc-teal::before { background: linear-gradient(90deg, #00D4AA, #00AAD4); }
.metric-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,.3); border-color: rgba(108,99,255,.25); }
.metric-icon { font-size: 28px; margin-bottom: 12px; }
.metric-value { font-size: 28px; font-weight: 900; line-height: 1; margin-bottom: 4px; letter-spacing: -1px; }
.metric-label { font-size: 12px; color: var(--text-3); font-weight: 500; text-transform: uppercase; letter-spacing: .8px; }
.metric-change {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 12px;
  font-weight: 600;
  margin-top: 8px;
  padding: 3px 8px;
  border-radius: 20px;
}
.mc-up { background: rgba(0,255,179,.1); color: var(--success); }
.mc-down { background: rgba(255,71,87,.1); color: var(--danger); }

/* TABLES */
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
thead th {
  padding: 12px 16px;
  text-align: left;
  color: var(--text-3);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
  font-size: 11px;
  background: var(--bg-input);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
thead th:first-child { border-radius: var(--r-sm) 0 0 0; }
thead th:last-child { border-radius: 0 var(--r-sm) 0 0; }
tbody tr {
  border-bottom: 1px solid rgba(255,255,255,.03);
  transition: var(--tr);
}
tbody tr:hover { background: var(--bg-hover); }
tbody td { padding: 12px 16px; color: var(--text-2); vertical-align: middle; }
.td-symbol { font-weight: 700; color: var(--text); }
.td-buy { color: var(--success); font-weight: 700; }
.td-sell { color: var(--danger); font-weight: 700; }
.td-profit { font-weight: 700; }
.td-pos { color: var(--success); }
.td-neg { color: var(--danger); }
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
}
.badge-success { background: rgba(0,255,179,.1); color: var(--success); border: 1px solid rgba(0,255,179,.2); }
.badge-danger { background: rgba(255,71,87,.1); color: var(--danger); border: 1px solid rgba(255,71,87,.2); }
.badge-warning { background: rgba(255,184,48,.1); color: var(--warning); border: 1px solid rgba(255,184,48,.2); }
.badge-primary { background: rgba(108,99,255,.1); color: var(--primary-light); border: 1px solid rgba(108,99,255,.2); }
.badge-secondary { background: rgba(0,212,255,.1); color: var(--secondary); border: 1px solid rgba(0,212,255,.2); }

/* BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 10px 20px;
  border: none;
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: var(--tr);
  font-family: var(--font);
  white-space: nowrap;
}
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; box-shadow: 0 0 15px rgba(108,99,255,.3); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(108,99,255,.5); }
.btn-secondary-c { background: linear-gradient(135deg, var(--secondary), #0066FF); color: #fff; }
.btn-secondary-c:hover { transform: translateY(-2px); box-shadow: var(--glow-s); }
.btn-success { background: linear-gradient(135deg, var(--success), var(--success-dark)); color: #000; font-weight: 700; }
.btn-success:hover { transform: translateY(-2px); box-shadow: var(--glow-success); }
.btn-danger { background: linear-gradient(135deg, var(--danger), #CC0022); color: #fff; }
.btn-danger:hover { transform: translateY(-2px); box-shadow: var(--glow-danger); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-2); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-ghost { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-2); }
.btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 7px 14px; font-size: 12px; }
.btn-lg { padding: 14px 28px; font-size: 15px; }
.btn-icon { width: 36px; height: 36px; padding: 0; border-radius: var(--r-sm); }
.btn-icon-sm { width: 28px; height: 28px; padding: 0; border-radius: 6px; font-size: 12px; }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; }

/* GRID LAYOUTS */
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
.grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
